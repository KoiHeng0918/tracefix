server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/tracefix?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: YOUR_MYSQL_USER
    password: YOUR_MYSQL_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password:
      database: 0
  rabbitmq:
    host: YOUR_SERVER_IP
    port: 5672
    username: YOUR_RABBITMQ_USER
    password: YOUR_RABBITMQ_PASSWORD
